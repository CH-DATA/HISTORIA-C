 const inp=t==='area'?`<textarea id="${id}" ${dis}>${esc(v)}</textarea>`:t==='sel'?`<select id="${id}" ${dis}><option value=""></option>${o.map(x=>`<option ${v===x?'selected':''}>${x}</option>`).join('')}</select>`:`<input id="${id}" type="${t||'text'}" value="${esc(v)}" ${dis}>`;
 return `<div style="${t==='area'?'grid-column:1/-1':''}"><label>${l} ${t==='area'&&ed?`<button class="mic" type="button" onclick="mic('${id}',this)">🎙</button>`:''}</label>${inp}</div>`}).join('')}</div>`;
const C=(pre,defs)=>Object.fromEntries(defs.filter(d=>d[0]!=='_sp').map(([k])=>[k,val(pre+'_'+k)]));
let REC=null;function mic(id,b){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return alert('Dictado por voz solo en Chrome o Edge.');
 if(REC){REC.stop();return}REC=new SR();REC.lang='es-PE';REC.continuous=true;b.classList.add('on');
 REC.onresult=e=>{const t=[...e.results].slice(e.resultIndex).map(r=>r[0].transcript).join(' ').trim();const el=$('#'+id);el.value+=(el.value?' ':'')+t};REC.onend=()=>{b.classList.remove('on');REC=null};REC.start()}

/* ===== CUENTA DEL PACIENTE: usuario = DNI, contraseña = DNI ===== */
async function syncPacUser(p,reset){
 let u=S.users.find(x=>x.rol==='paciente'&&x.pacienteId===p.id);const dni=String(p.dni).toLowerCase();
 const nombre=(p.apePat+' '+p.apeMat+', '+p.nombres).trim();
 if(u&&u.user===dni&&u.nombre===nombre&&!reset)return;
 if(!u)u={id:uid(),rol:'paciente',pacienteId:p.id};
 if(!u.pass||u.user!==dni||reset)u.pass=await sha(p.dni);
 u.user=dni;u.nombre=nombre;await DB.put('users',u)}
async function syncPerUser(r){
 let u=S.users.find(x=>x.rol==='trabajador'&&x.personalId===r.id);const dni=String(r.doc).trim().toLowerCase(),nombre=(r.apePat+' '+r.apeMat+', '+r.nombres).trim();
 if(u&&u.user===dni&&u.nombre===nombre)return;
 if(!u)u={id:uid(),rol:'trabajador',personalId:r.id};
 if(!u.pass||u.user!==dni)u.pass=await sha(String(r.doc).trim());
 u.user=dni;u.nombre=nombre;await DB.put('users',u)}
async function resetPac(id){const u=S.users.find(x=>x.id===id),p=S.pacientes.find(x=>x.id===u.pacienteId);if(!p)return;
 if(!confirm('¿Restablecer la contraseña de '+u.nombre+' a su DNI?'))return;await syncPacUser(p,true);await log('Restableció clave de paciente',p.hc);alert('Listo. Usuario y contraseña: '+p.dni);render()}

async function hcSaveAll(id,silent){
 const p=S.pacientes.find(x=>x.id===id),g=CUR,dni=val('x_dni').trim();
 if(!/^\d{8,12}$/.test(dni)){alert('DNI inválido (8 a 12 dígitos).');return false}
 if(S.pacientes.some(x=>x.dni===dni&&x.id!==id)){alert('DNI ya registrado en otra historia.');return false}
 const f=C('fil',FIL);if(!f.apePat||!f.nombres||!f.motivo){alert('Apellido paterno, nombre y motivo de ingreso son obligatorios.');return false}
 Object.assign(p,{dni,sexo:val('x_sexo'),fnac:val('x_fnac'),seguro:val('x_seg'),tel:val('x_tel'),dir:val('x_dir'),alergias:val('x_ale'),
  apePat:f.apePat.toUpperCase(),apeMat:f.apeMat.toUpperCase(),nombres:f.nombres.toUpperCase(),lugarNac:f.lugarNac,procedencia:f.procedencia,instruccion:f.instruccion,ocupacion:f.ocupacion,civil:f.civil,edadRef:f.edad});
 g.fil=f;
 await DB.put('pacientes',p);await syncPacUser(p);await DB.put('ingresos',g);await log('Editó historia completa',p.hc+' #'+g.n);
 if(!silent)alert('Historia guardada.');return true}
async function addFicha(id){
 const fecha=val('fc_fecha'),servicio=val('fc_serv').trim(),descripcion=val('fc_desc').trim();
 if(!fecha||!servicio||!descripcion)return alert('Completa fecha, servicio y descripción.');
 if(!await hcSaveAll(id,true))return;
 const p=S.pacientes.find(x=>x.id===id);p.fichas=p.fichas||[];
 const desde=val('fc_desde');
 p.fichas.push({id:uid(),fecha,servicio,descripcion,desde,prof:val('fc_prof').trim(),dx:val('fc_dx').trim(),user:ME.nombre,ts:Date.now()});
 await DB.put('pacientes',p);await log('Agregó ficha',p.hc+' · '+servicio);render()}

 ${sec('IMPRESIÓN DIAGNÓSTICA',g.dx.map(d=>`<p>${esc(d.c)} — ${esc(d.d)} (${d.tipo})</p>`).join(''))}

const getArch=pid=>S.archivo.find(a=>a.pacienteId===pid)||{id:'ar_'+pid,pacienteId:pid,est:'',mod:'',caja:'',estadoHC:'Activa',movs:[]};
const docsDe=pid=>S.legajo.filter(d=>d.pacienteId===pid).sort((a,b)=>a.folioIni-b.folioIni);
const ultFolio=pid=>Math.max(0,...docsDe(pid).map(d=>d.folioFin));
const vencida=m=>!m.devol&&m.prevista&&m.prevista<hoyISO();
const ubic=a=>[a.est&&'Estante '+a.est,a.mod&&'Módulo '+a.mod,a.caja&&'Caja '+a.caja].filter(Boolean).join(' · ')||'Sin ubicar';
const bEst=e=>({Activa:'b-ok',Prestada:'b-op',Extraviada:'b-red'}[e]||'');
const folTxt=d=>d.folioIni+(d.folioFin>d.folioIni?'–'+d.folioFin:'');
const fdt=t=>t?new Date(t).toLocaleDateString('es-PE'):'';

/* ---- formulario de préstamo (reutilizable) ---- */
const prForm=pid=>`<div class="grid g4">${pid?`<input type="hidden" id="pr_pid" value="${pid}">`:`<div style="grid-column:span 2"><label>Paciente (N° HC, DNI o apellidos)</label><input id="pq" autocomplete="off" oninput="prSearch(this.value)" placeholder="Buscar…"><input type="hidden" id="pr_pid"><div id="pres"></div></div>`}
 <div><label>Servicio solicitante</label><input id="pr_serv" list="pr_servs" placeholder="Seleccione o escriba…"><datalist id="pr_servs">${SERVICIOS.map(x=>`<option value="${x}">`).join('')}</datalist></div>
 <div><label>Solicitante (responsable)</label><input id="pr_sol" placeholder="Dr(a). / Lic. …"></div>
 <div style="${pid?'grid-column:span 2':'grid-column:span 2'}"><label>Motivo del préstamo</label><input id="pr_mot" placeholder="Consulta, junta médica, auditoría, trámite…"></div>
 <div><label>Devolución prevista</label><input id="pr_prev" type="date" value="${masDias(3)}"></div></div>
 <br><button class="btn" onclick="prestar()">📤 Registrar préstamo</button>`;
function prSearch(q){q=q.toLowerCase();$('#pr_pid').value='';$('#pres').innerHTML=q.length<2?'':'<div class="res">'+S.pacientes.filter(p=>(p.hc+p.dni+p.apePat+p.apeMat+p.nombres).toLowerCase().includes(q)).slice(0,8).map(p=>`<div onclick="prPick('${p.id}')"><b>${p.hc}</b> ${pacNom(p)} · DNI ${esc(p.dni)}</div>`).join('')+'</div>'}
function prPick(id){const p=pacById(id);$('#pr_pid').value=id;$('#pq').value=p.hc+' — '+p.apePat+' '+p.apeMat+', '+p.nombres;$('#pres').innerHTML=''}

/* ---- panel general del archivo ---- */
let AQ='';
const archRows=q=>{q=(q||'').toLowerCase();return S.pacientes.filter(p=>!q||(p.dni+p.apePat+p.apeMat+p.nombres+p.hc).toLowerCase().includes(q)).sort((a,b)=>a.hc.localeCompare(b.hc)).map(p=>{const a=getArch(p.id),n=docsDe(p.id).filter(d=>d.estado!=='Anulado').length,pend=(a.movs||[]).find(m=>!m.devol);
 return `<tr class="click" onclick="go('#/arch/${p.id}')"><td>${p.hc}</td><td>${pacNom(p)}</td><td>${esc(p.dni)}</td><td>${ubic(a)}</td><td><span class="badge ${bEst(a.estadoHC)}">${a.estadoHC}</span>${pend&&vencida(pend)?' <span class="badge b-red">VENCIDA</span>':''}</td><td>${n} doc. / ${ultFolio(p.id)} fol.</td><td><button class="btn sm" onclick="event.stopPropagation();go('#/arch/${p.id}')">📁 Abrir legajo</button></td></tr>`}).join('')||'<tr><td colspan=7>Sin resultados</td></tr>'};
function archView(){R.editing=true;
 const movs=[];S.archivo.forEach(a=>(a.movs||[]).forEach(m=>movs.push({...m,pid:a.pacienteId})));
 const pend=movs.filter(m=>!m.devol).sort((a,b)=>(a.prevista||'').localeCompare(b.prevista||'')),venc=pend.filter(vencida);
 const cnt=e=>S.pacientes.filter(p=>getArch(p.id).estadoHC===e).length,folios=S.legajo.filter(d=>d.estado!=='Anulado').length;
 const mrow=m=>{const p=pacById(m.pid);return `<tr><td>${fmt(m.ts)}</td><td>${p?p.hc:''}</td><td>${pacNom(p)}</td><td>${esc(m.servicio)}</td><td>${esc(m.solicita)}</td><td>${esc(m.motivo)}</td><td>${fd(m.prevista)}</td><td>${m.devol?fmt(m.devol.ts)+(m.devol.obs?'<br><small>'+esc(m.devol.obs)+'</small>':''):vencida(m)?'<span class="badge b-red">Vencida</span>':'<span class="badge b-op">Pendiente</span>'}</td><td>${esc(m.user)}</td></tr>`};
 return `<div class="top"><h1>📁 Legajo / Archivo de historias clínicas</h1></div>
 ${venc.length?`<div class="alert">⚠ ${venc.length} historia(s) clínica(s) con devolución vencida: ${venc.map(m=>(pacById(m.pid)||{}).hc).join(', ')}</div>`:''}
 <div class="stats"><div class="st"><span>HC registradas</span><b>${S.pacientes.length}</b></div><div class="st"><span>Activas</span><b>${cnt('Activa')}</b></div><div class="st"><span>Prestadas</span><b>${cnt('Prestada')}</b></div><div class="st"><span>Vencidas</span><b style="color:var(--red)">${venc.length}</b></div><div class="st"><span>Archivo pasivo</span><b>${cnt('Pasiva')}</b></div><div class="st"><span>Extraviadas</span><b>${cnt('Extraviada')}</b></div><div class="st"><span>Documentos foliados</span><b>${folios}</b></div></div>
 <div class="card"><h3>Búsqueda y ubicación de historias clínicas</h3><input id="aq" placeholder="Buscar por N° HC, DNI, apellidos o nombre…" value="${esc(AQ)}" oninput="AQ=this.value;$('#al').innerHTML=archRows(this.value)"><br><br>
 <table><tr><th>N° HC</th><th>Paciente</th><th>DNI</th><th>Ubicación</th><th>Estado</th><th>Legajo</th><th></th></tr><tbody id="al">${archRows(AQ)}</tbody></table></div>
 ${can('arch')?`<div class="card"><h3>Nuevo préstamo / solicitud de HC</h3>${prForm('')}</div>`:''}
 <div class="card"><h3>Historias prestadas pendientes de devolución (${pend.length})</h3><table><tr><th>Fecha préstamo</th><th>N° HC</th><th>Paciente</th><th>Servicio</th><th>Solicitante</th><th>Motivo</th><th>Prevista</th><th>Estado</th><th></th></tr>
 ${pend.map(m=>{const p=pacById(m.pid);return `<tr><td>${fmt(m.ts)}</td><td>${p?p.hc:''}</td><td>${pacNom(p)}</td><td>${esc(m.servicio)}</td><td>${esc(m.solicita)}</td><td>${esc(m.motivo)}</td><td class="${vencida(m)?'hi':''}">${fd(m.prevista)}</td><td>${vencida(m)?'<span class="badge b-red">Vencida</span>':'<span class="badge b-op">En préstamo</span>'}</td><td>${can('arch')?`<button class="btn sm" onclick="devolver('${m.pid}','${m.id}')">📥 Devolver</button>`:''}</td></tr>`}).join('')||'<tr><td colspan=9>No hay préstamos pendientes</td></tr>'}</table></div>
 <div class="card"><h3>Reporte de movimientos (últimos 200)</h3><table><tr><th>Fecha</th><th>N° HC</th><th>Paciente</th><th>Servicio</th><th>Solicitante</th><th>Motivo</th><th>Prevista</th><th>Devolución</th><th>Registró</th></tr>${movs.sort((a,b)=>b.ts-a.ts).slice(0,200).map(mrow).join('')||'<tr><td colspan=9>Sin movimientos</td></tr>'}</table></div>`}

/* ---- legajo de un paciente ---- */
function legajoView(pid){
 const p=pacById(pid);if(!p)return $('#main').innerHTML='No encontrado';R.editing=true;
 const a=getArch(pid),docs=docsDe(pid),ca=can('arch'),cl=can('leg'),ml=a.movs||[],pend=ml.find(m=>!m.devol);
 if(lastLog!=='leg'+pid){lastLog='leg'+pid;log('Consultó legajo',p.hc)}
 $('#main').innerHTML=`<div class="top"><div><h1>📁 Legajo — ${pacNom(p)}</h1><span style="color:var(--mu)">${p.hc} · DNI ${esc(p.dni)} · ${ageOf(p)} años · ${esc(p.seguro)} · <span class="badge ${bEst(a.estadoHC)}">${a.estadoHC}</span></span></div>
  <div class="noprint"><button class="btn sec" onclick="go('#/arch')">← Volver al archivo</button> <button class="btn sec" onclick="printLeg('${pid}')">🖨 Imprimir carátula e índice</button>${can('pac')?` <button class="btn sec" onclick="go('#/pac/${pid}')">Ver historia clínica</button>`:''}</div></div>
 ${p.alergias?`<div class="alert">⚠ ALERGIAS: ${esc(p.alergias)}</div>`:''}
 ${pend?`<div class="alert">📤 Esta HC está PRESTADA a ${esc(pend.servicio)} (${esc(pend.solicita)}) desde ${fmt(pend.ts)}${vencida(pend)?' — DEVOLUCIÓN VENCIDA':''}</div>`:''}
 <div class="stats"><div class="st"><span>Estado</span><b>${a.estadoHC}</b></div><div class="st"><span>Ubicación</span><b>${ubic(a)}</b></div><div class="st"><span>Documentos vigentes</span><b>${docs.filter(d=>d.estado!=='Anulado').length}</b></div><div class="st"><span>Último folio</span><b>${ultFolio(pid)}</b></div><div class="st"><span>Préstamos</span><b>${ml.length}</b></div></div>
 ${ca?`<div class="card"><h3>Ubicación y estado de la HC en el archivo</h3><div class="grid g4"><div><label>Estante</label><input id="a_est" value="${esc(a.est)}"></div><div><label>Módulo</label><input id="a_mod" value="${esc(a.mod)}"></div><div><label>Caja / Sobre</label><input id="a_caja" value="${esc(a.caja)}"></div><div style="align-self:end"><button class="btn" onclick="setUbic('${pid}')">💾 Guardar ubicación</button></div></div><br>
  <b style="font-size:12px;color:var(--mu)">CAMBIAR ESTADO:</b> ${a.estadoHC==='Pasiva'||a.estadoHC==='Extraviada'?`<button class="btn sm sec" onclick="setEstado('${pid}','Activa')">♻ Reactivar / Encontrada</button> `:''}${a.estadoHC==='Activa'?`<button class="btn sm sec" onclick="setEstado('${pid}','Pasiva')">🗄 Pasar a archivo pasivo</button> `:''}${a.estadoHC!=='Extraviada'&&a.estadoHC!=='Depurada'?`<button class="btn sm red" onclick="setEstado('${pid}','Extraviada')">❓ Reportar extraviada</button> `:''}${ME.rol==='admin'&&a.estadoHC==='Pasiva'?`<button class="btn sm red" onclick="setEstado('${pid}','Depurada')">🗑 Depurar (baja definitiva)</button>`:''}</div>`:''}
 <div class="card"><h3>Documentos del legajo (foliados)</h3>
 ${cl?`<div class="grid g4"><div><label>Tipo de documento</label><select id="ld_tipo"><option value=""></option>${TIPOS_DOC.map(x=>`<option>${x}</option>`).join('')}</select></div><div><label>Fecha del documento</label><input id="ld_fecha" type="date" value="${hoyISO()}"></div><div><label>N° de hojas (folios)</label><input id="ld_hojas" type="number" min="1" value="1"></div><div><label>Archivo (PDF/imagen, máx. 600 KB)</label><input id="ld_file" type="file" accept=".pdf,image/*"></div>
 <div style="grid-column:1/-1"><label>Descripción / observaciones <button class="mic" type="button" onclick="mic('ld_desc',this)">🎙</button></label><textarea id="ld_desc" style="min-height:48px"></textarea></div></div><br><button class="btn" onclick="addDoc('${pid}')">+ Agregar documento (se asigna el siguiente folio: ${ultFolio(pid)+1})</button><br><br>`:''}
 <table><tr><th>Folio</th><th>Tipo</th><th>Fecha</th><th>Descripción</th><th>Archivo</th><th>Estado</th><th>Registró</th><th></th></tr>
 ${docs.map(d=>`<tr style="${d.estado==='Anulado'?'opacity:.55;text-decoration:line-through':''}"><td><b>${folTxt(d)}</b></td><td>${esc(d.tipo)}</td><td>${fd(d.fecha)}</td><td>${esc(d.desc)}</td><td>${d.data?`<button class="btn sm sec" onclick="verDoc('${d.id}')">👁 ${esc(d.nombre)}</button>`:'—'}</td><td>${d.estado==='Anulado'?'<span class="badge b-red">Anulado</span><br><small>'+esc(d.motivoAnul)+'</small>':'<span class="badge b-ok">Vigente</span>'}</td><td>${esc(d.user)}<br><small>${fmt(d.ts)}</small></td><td>${cl&&d.estado!=='Anulado'?`<button class="btn red sm" onclick="anularDoc('${d.id}')">Anular</button>`:''}</td></tr>`).join('')||'<tr><td colspan=8>Sin documentos en el legajo</td></tr>'}</table>
 <p style="color:var(--mu);font-size:12px">Los folios son correlativos y no se reutilizan: un documento anulado conserva su número de folio y queda registrado.</p></div>
 ${ca&&a.estadoHC==='Activa'?`<div class="card"><h3>Solicitar / prestar esta HC</h3>${prForm(pid)}</div>`:''}
 <div class="card"><h3>Movimientos de la HC (préstamos y devoluciones)</h3><table><tr><th>Fecha</th><th>Servicio</th><th>Solicitante</th><th>Motivo</th><th>Prevista</th><th>Devolución</th><th>Registró</th><th></th></tr>
 ${[...ml].reverse().map(m=>`<tr><td>${fmt(m.ts)}</td><td>${esc(m.servicio)}</td><td>${esc(m.solicita)}</td><td>${esc(m.motivo)}</td><td class="${vencida(m)?'hi':''}">${fd(m.prevista)}</td><td>${m.devol?fmt(m.devol.ts)+' · '+esc(m.devol.user)+(m.devol.obs?'<br><small>'+esc(m.devol.obs)+'</small>':''):vencida(m)?'<span class="badge b-red">Vencida</span>':'<span class="badge b-op">Pendiente</span>'}</td><td>${esc(m.user)}</td><td>${!m.devol&&ca?`<button class="btn sm" onclick="devolver('${pid}','${m.id}')">📥 Devolver</button>`:''}</td></tr>`).join('')||'<tr><td colspan=8>Sin movimientos</td></tr>'}</table></div>`}

/* ---- acciones ---- */
async function addDoc(pid){
 if(!can('leg'))return alert('Sin permiso.');const p=pacById(pid);
 const tipo=val('ld_tipo'),fecha=val('ld_fecha'),desc=val('ld_desc').trim(),hojas=Math.max(1,parseInt(val('ld_hojas'))||1);
 if(!tipo||!fecha)return alert('Indica el tipo de documento y la fecha.');
 const fi=$('#ld_file').files[0];let data='',nombre='';
 if(fi){if(fi.size>600*1024)return alert('El archivo supera 600 KB. Reduce su tamaño o registra el documento sin adjunto.');
  data=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(fi)});nombre=fi.name}
 const ini=ultFolio(pid)+1;
 await DB.put('legajo',{id:uid(),pacienteId:pid,tipo,fecha,desc,hojas,folioIni:ini,folioFin:ini+hojas-1,estado:'Vigente',nombre,data,user:ME.nombre,ts:Date.now()});
 await log('Agregó documento al legajo',p.hc+' · '+tipo+' · fol. '+ini+(hojas>1?'-'+(ini+hojas-1):''));legajoView(pid)}
async function anularDoc(id){if(!can('leg'))return;const d=S.legajo.find(x=>x.id===id);
 const m=prompt('Motivo de la anulación (obligatorio). El folio no se reutiliza:');if(!m||!m.trim())return;
 d.estado='Anulado';d.motivoAnul=m.trim();d.anuladoPor=ME.nombre;d.anuladoTs=Date.now();await DB.put('legajo',d);
 await log('Anuló documento del legajo',(pacById(d.pacienteId)||{}).hc+' fol. '+folTxt(d)+' · '+m.trim());legajoView(d.pacienteId)}
function verDoc(id){const d=S.legajo.find(x=>x.id===id);if(!d||!d.data)return;
 fetch(d.data).then(r=>r.blob()).then(b=>window.open(URL.createObjectURL(b),'_blank'));log('Visualizó documento del legajo',(pacById(d.pacienteId)||{}).hc+' fol. '+folTxt(d))}
async function setUbic(pid){if(!can('arch'))return;const a=getArch(pid);Object.assign(a,{est:val('a_est').trim(),mod:val('a_mod').trim(),caja:val('a_caja').trim()});
 if(!S.archivo.includes(a)){}await DB.put('archivo',a);await log('Ubicó HC en archivo',(pacById(pid)||{}).hc+' · '+ubic(a));legajoView(pid)}
async function setEstado(pid,e){if(!can('arch'))return;const a=getArch(pid),p=pacById(pid);
 const txt={Activa:'reactivar',Pasiva:'pasar a archivo pasivo',Extraviada:'reportar como EXTRAVIADA',Depurada:'DEPURAR (baja definitiva)'}[e];
 if(!confirm('¿Confirma '+txt+' la HC '+p.hc+'?'))return;
 let obs='';if(e==='Extraviada'||e==='Depurada'){obs=prompt('Detalle / sustento (obligatorio):')||'';if(!obs.trim())return}
 const ant=a.estadoHC;a.estadoHC=e;a.hist=a.hist||[];a.hist.push({ts:Date.now(),de:ant,a:e,obs,user:ME.nombre});
 await DB.put('archivo',a);await log('Cambió estado de HC',p.hc+': '+ant+' → '+e+(obs?' · '+obs:''));legajoView(pid)}
async function prestar(){if(!can('arch'))return alert('Sin permiso.');
 const pid=val('pr_pid'),servicio=val('pr_serv').trim(),solicita=val('pr_sol').trim(),motivo=val('pr_mot').trim(),prevista=val('pr_prev');
 if(!pid)return alert('Selecciona un paciente de la lista.');if(!servicio||!solicita||!motivo||!prevista)return alert('Completa servicio, solicitante, motivo y fecha prevista de devolución.');
 const a=getArch(pid),p=pacById(pid);if(a.estadoHC!=='Activa')return alert('No se puede prestar: la HC está '+a.estadoHC.toLowerCase()+'.');
 a.movs=a.movs||[];a.movs.push({id:uid(),ts:Date.now(),servicio,solicita,motivo,prevista,user:ME.nombre,devol:null});a.estadoHC='Prestada';
 await DB.put('archivo',a);await log('Préstamo de HC',p.hc+' → '+servicio+' ('+solicita+')');render()}
async function devolver(pid,mid){if(!can('arch'))return;const a=getArch(pid),m=(a.movs||[]).find(x=>x.id===mid),p=pacById(pid);if(!m)return;
 const obs=prompt('Observaciones de la devolución (documentos faltantes, estado de la carpeta). Deja vacío si está conforme:');if(obs===null)return;
 m.devol={ts:Date.now(),user:ME.nombre,obs:obs.trim()};a.estadoHC='Activa';await DB.put('archivo',a);await log('Devolución de HC',p.hc+(obs.trim()?' · '+obs.trim():''));render()}
function printLeg(pid){const p=pacById(pid),a=getArch(pid),docs=docsDe(pid),ml=a.movs||[];
 popup(`<h2 style="text-align:center;font-size:18px">CARÁTULA E ÍNDICE DE FOLIOS DEL LEGAJO</h2>
 <table class="f" style="border:1px solid #000;margin-bottom:12px"><tr><td><b>N° HC:</b> ${p.hc}</td><td><b>DNI:</b> ${esc(p.dni)}</td><td><b>Seguro:</b> ${esc(p.seguro)}</td></tr><tr><td colspan="2"><b>Paciente:</b> ${pacNom(p)}</td><td><b>Estado HC:</b> ${a.estadoHC}</td></tr><tr><td colspan="3"><b>Ubicación:</b> ${ubic(a)}</td></tr></table>
 <h2><u>ÍNDICE DE DOCUMENTOS</u></h2><table style="width:100%;border-collapse:collapse" border="1" cellpadding="4"><tr><th>Folio</th><th>Documento</th><th>Fecha</th><th>Descripción</th><th>Estado</th></tr>${docs.map(d=>`<tr><td>${folTxt(d)}</td><td>${esc(d.tipo)}</td><td>${fd(d.fecha)}</td><td>${esc(d.desc)}</td><td>${d.estado==='Anulado'?'Anulado: '+esc(d.motivoAnul):'Vigente'}</td></tr>`).join('')||'<tr><td colspan=5>Sin documentos</td></tr>'}</table>
 <p><b>Total de folios:</b> ${ultFolio(pid)} · <b>Documentos vigentes:</b> ${docs.filter(d=>d.estado!=='Anulado').length}</p>
 <h2><u>CONTROL DE MOVIMIENTOS</u></h2><table style="width:100%;border-collapse:collapse" border="1" cellpadding="4"><tr><th>Fecha</th><th>Servicio</th><th>Solicitante</th><th>Motivo</th><th>Prevista</th><th>Devolución</th></tr>${ml.map(m=>`<tr><td>${fmt(m.ts)}</td><td>${esc(m.servicio)}</td><td>${esc(m.solicita)}</td><td>${esc(m.motivo)}</td><td>${fd(m.prevista)}</td><td>${m.devol?fmt(m.devol.ts)+' '+esc(m.devol.obs||''):'Pendiente'}</td></tr>`).join('')||'<tr><td colspan=6>Sin movimientos</td></tr>'}</table>
 <br><br><table style="width:100%"><tr><td style="text-align:center">____________________<br>Responsable de Archivo</td><td style="text-align:center">____________________<br>V°B° Jefatura</td></tr></table>`);log('Imprimió carátula de legajo',p.hc)}

function usersView(){return `<div class="top"><h1>Usuarios</h1></div><div class="card"><p style="color:var(--mu);margin-top:0">Cada paciente registrado tiene su cuenta automática: <b>usuario = DNI</b> y <b>contraseña = DNI</b>. Solo ve su propio historial.</p><table><tr><th>Nombre</th><th>Usuario</th><th>Rol</th><th></th></tr>${S.users.map(u=>`<tr><td>${esc(u.nombre)}</td><td>${esc(u.user)}</td><td>${u.rol==='paciente'?'<span class="badge">paciente</span>':u.rol}</td><td>${u.rol==='paciente'?`<button class="btn sec sm" onclick="resetPac('${u.id}')">Restablecer clave (= DNI)</button>`:(u.id!==ME.id?`<button class="btn red sm" onclick="delUser('${u.id}')">Eliminar</button>`:'')}</td></tr>`).join('')}</table></div>
 <div class="card"><h3>Nuevo usuario</h3><div class="grid g4"><div><label>Nombre</label><input id="nu_n"></div><div><label>Usuario</label><input id="nu_u"></div><div><label>Contraseña</label><input id="nu_p" type="password"></div><div><label>Rol</label><select id="nu_r"><option value="medico">Médico</option><option value="enfermeria">Enfermería</option><option value="admision">Admisión</option><option value="archivo">Archivo (legajo)</option><option value="admin">Administrador</option></select></div></div><br><button class="btn" onclick="addUser()">Crear</button></div>`}
async function addUser(){const n=val('nu_n').trim(),u=val('nu_u').trim().toLowerCase(),p=val('nu_p');if(!n||!u||p.length<6)return alert('Datos incompletos (contraseña mín. 6).');if(S.users.some(x=>x.user===u))return alert('Usuario ya existe.');
 await DB.put('users',{id:uid(),nombre:n,user:u,rol:val('nu_r'),pass:await sha(p)});await log('Creó usuario',u);render()}
async function delUser(id){if(!confirm('¿Eliminar usuario?'))return;await log('Eliminó usuario',S.users.find(u=>u.id===id).user);await DB.del('users',id);render()}
function auditView(){return `<div class="top"><h1>Auditoría de accesos</h1></div><div class="card"><table><tr><th>Fecha</th><th>Usuario</th><th>Acción</th><th>Detalle</th></tr>${[...S.audit].sort((a,b)=>b.ts-a.ts).slice(0,300).map(e=>`<tr><td>${fmt(e.ts)}</td><td>${esc(e.user)}</td><td>${esc(e.accion)}</td><td>${esc(e.detalle)}</td></tr>`).join('')}</table></div>`}

 const data=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(f)});const prev=S6D[k];S6D[k]={nombre:f.name,data,ts:Date.now()};
 if(s6Tot()>800*1024){if(prev)S6D[k]=prev;else delete S6D[k];s6List();return alert('Los adjuntos suman demasiado (límite ~800 KB por legajo). Quita alguno o reduce su tamaño.')}s6List()}

   <h4 style="margin:14px 0 6px">Evaluación de desempeño – rendimiento <small style="font-weight:400;color:var(--mu)">(de 1 a muchos)</small></h4>${s3Table('eval',d.eval)}
   <h4 style="margin:20px 0 6px">Reconocimientos, méritos, deméritos, sanciones administrativas y judiciales</h4>${s3Table('sanc',d.sanc)}
  </details>
  <details class="card" id="s9box" ${d.rel&&d.rel.length?'open':''}><summary style="cursor:pointer;font-weight:700;font-size:15px">S9. Relaciones de trabajo</summary>
   <div style="margin-top:12px">${s3Table('rel',d.rel)}</div>
  </details>
  <details class="card" id="s10box" ${d.sst&&d.sst.length?'open':''}><summary style="cursor:pointer;font-weight:700;font-size:15px">S10. SST / Bienestar social</summary>
   <div style="margin-top:12px">${s3Table('sst',d.sst)}</div>

  <details class="card" id="s11box" ${Object.keys(d.s11||{}).length?'open':''}><summary style="cursor:pointer;font-weight:700;font-size:15px">S11. Desvinculación</summary>
   <div style="overflow-x:auto;margin-top:12px"><table><thead><tr><th>MOTIVO DE CESE</th><th>FECHA CESE DEFINITIVO</th><th>CESE TEMPORAL – DESDE</th><th>CESE TEMPORAL – HASTA</th></tr></thead><tbody>${s11Rows(d.s11)}</tbody></table></div>

 $('#main').classList.add('fx');adjList();s6List();$('#s4box').addEventListener('input',s4Tot);$('#s4box').addEventListener('click',()=>setTimeout(s4Tot));$('#s2box').addEventListener('input',s4Tot);$('#s2box').addEventListener('click',()=>setTimeout(s4Tot));s4Tot();$('#s5box').addEventListener('input',s5Upd);$('#s5box').addEventListener('click',()=>setTimeout(s5Upd));s5Upd();$('#s2box').addEventListener('input',e=>{if(e.target.type!=='date')return;const tr=e.target.closest('tr');tr.querySelector('.s2t').textContent=fmtYMD(ymd(tr.querySelector('[data-k=fi]').value,tr.querySelector('[data-k=ff]').value));s2Tot()});s2Tot();document.querySelectorAll('#fam .famr').forEach(tr=>{const f=tr.querySelector('[data-k=fnac]');f.oninput=()=>{tr.querySelector('[data-k=edad]').value=f.value?edadDe(f.value):''}});$('#lp_fnac').oninput=function(){$('#lp_edad').textContent=this.value?edadDe(this.value)+' años':'auto'}}

const s2Rows=q=>{q=(q||'').toLowerCase();return S.personal.filter(p=>!q||((p.doc||'')+p.apePat+p.apeMat+p.nombres).toLowerCase().includes(q)).sort((a,b)=>(a.apePat+a.apeMat).localeCompare(b.apePat+b.apeMat)).map(p=>`<tr class="click" onclick="go('#/per/s2/${p.id}')"><td>${esc(p.tdoc||'DNI')} ${esc(p.doc)}</td><td>${perNom(p)}</td><td>${(p.vinc||[]).length}</td><td>${fmtYMD(sumYMD((p.vinc||[]).map(r=>ymd(r.fi,r.ff))))}</td><td>${(p.sind||[]).length}</td><td><button class="btn sm" onclick="event.stopPropagation();go('#/per/s2/${p.id}')">✏ Abrir S2</button></td></tr>`).join('')||'<tr><td colspan=6>Sin legajos registrados</td></tr>'};
function s2List(){R.editing=true;return `<div class="top"><h1>🏢 S2. Incorporación / vinculación con la entidad</h1></div>
 <div class="card"><input placeholder="Buscar trabajador por documento, apellidos o nombres…" oninput="$('#s2l').innerHTML=s2Rows(this.value)"><br><br>
 <table><tr><th>Documento</th><th>Apellidos y nombres</th><th>Puestos</th><th>Tiempo total</th><th>Afil. sindicales</th><th></th></tr><tbody id="s2l">${s2Rows('')}</tbody></table></div>`}
function s2Form(id){const d=id?S.personal.find(x=>x.id===id):{};if(!d){$('#main').innerHTML='Legajo no encontrado';return}R.editing=true;id=id||'';
 $('#main').innerHTML=`<div class="top"><div><h1>S2. Incorporación / vinculación con la entidad</h1><span style="color:var(--mu)">Selecciona al trabajador y registra sus puestos y afiliaciones</span></div>
  <div class="noprint"><button class="btn" onclick="s2Save('${id}')">💾 Guardar</button></div></div>
  <div class="card"><label>Trabajador</label><select id="s2_trab" onchange="go('#/per/s2'+(this.value?'/'+this.value:''))"><option value="">— Seleccionar legajo —</option>${S.personal.slice().sort((a,b)=>(a.apePat+a.apeMat).localeCompare(b.apePat+b.apeMat)).map(x=>`<option value="${x.id}" ${x.id===id?'selected':''}>${esc(x.tdoc||'DNI')} ${esc(x.doc)} — ${perNom(x)}</option>`).join('')}</select></div>
  <div class="card"><h3>Puestos / cargos desempeñados en la entidad <small style="font-weight:400;color:var(--mu)">(de uno a muchos)</small></h3>${s2Table('s2v',VINC_C,d.vinc,'v',true)}</div>
  <div class="card"><h3>Información de afiliaciones sindicales <small style="font-weight:400;color:var(--mu)">(de uno a muchos)</small></h3>${s2Table('s2s',SIND_C,d.sind,'s',false)}</div>
  <button class="btn" onclick="s2Save('${id}')">💾 Guardar</button> `;
 $('#main').addEventListener('input',e=>{if(e.target.type!=='date')return;const tr=e.target.closest('tr');tr.querySelector('.s2t').textContent=fmtYMD(ymd(tr.querySelector('[data-k=fi]').value,tr.querySelector('[data-k=ff]').value));s2Tot()});s2Tot()}
async function s2Save(id){if(!can('per'))return alert('Sin permiso.');const r=S.personal.find(x=>x.id===id);if(!r)return alert('Primero selecciona al trabajador.');
 Object.assign(r,{vinc:s2Get('s2v'),sind:s2Get('s2s'),modificado:Date.now(),modificadoPor:ME.nombre});
 await DB.put('personal',r);await log('Guardó S2 vinculación',r.tdoc+' '+r.doc);alert('S2 guardado.');go('#/per/s2/'+id)}
async function perSave(id){
 if(!can('per'))return alert('Sin permiso.');
 if(ME.rol==='trabajador'&&id!==ME.personalId)return alert('Sin permiso.');
 const f=C('lp',LP_ALL);
 if(!f.apePat||!f.nombres)return alert('Apellido paterno y nombres son obligatorios.');
 if(!f.doc.trim())return alert('Indica el N° de documento.');
 if((f.tdoc||'DNI')==='DNI'&&!/^\d{8}$/.test(f.doc.trim()))return alert('El DNI debe tener 8 dígitos.');
 if(S.personal.some(x=>x.doc===f.doc.trim()&&x.id!==id))return alert('Ya existe un legajo con ese documento.');
 for(const fi of [...(($('#lp_files')||{}).files||[])]){
  if(fi.size>600*1024)return alert('"'+fi.name+'" supera 600 KB. Reduce su tamaño.');
  const data=await new Promise(r=>{const fr=new FileReader();fr.onload=()=>r(fr.result);fr.readAsDataURL(fi)});
  PADJ.push({id:uid(),nombre:fi.name,data,ts:Date.now()})}
 if(s6Tot()>800*1024)return alert('Los adjuntos suman demasiado (límite ~800 KB por legajo). Quita alguno o reduce su tamaño.');
 const r=S.personal.find(x=>x.id===id)||{id:uid(),creado:Date.now(),creadoPor:ME.nombre};
 Object.assign(r,f,{apePat:f.apePat.toUpperCase(),apeMat:f.apeMat.toUpperCase(),nombres:f.nombres.toUpperCase(),doc:f.doc.trim(),
  disTipos:LP_DISTIPOS.filter(t=>$('#lp_dt_'+t).checked),disOtra:val('lp_disOtra').trim(),
  bonif:[...document.querySelectorAll('#bon .bonr')].map(x=>({t:x.children[0].value.trim(),d:x.children[1].value.trim()})).filter(x=>x.t||x.d),
  fam:[...document.querySelectorAll('#fam .famr')].map(tr=>Object.fromEntries([...tr.querySelectorAll('[data-k]')].map(e=>[e.dataset.k,e.value.trim()]))),situacion:val('lp_situacion').trim(),vinc:s2Get('s2v'),sind:s2Get('s2s'),rel:s3Get('rel'),sst:s3Get('sst'),s11:s11Get(),s6docs:S6D,eval:s3Get('eval'),acc:s3Get('acc'),sanc:s3Get('sanc'),permSem:val('s5_permSem'),permMen:val('s5_permMen'),permMot:val('s5_permMot').trim(),hextra:val('s5_hextra'),saldo:val('s5_saldo'),tele:s3Get('tele'),licg:s3Get('licg'),lics:s3Get('lics'),vper:s3Get('vper'),vprog:s3Get('vprog'),vrep:s3Get('vrep'),exp:s3Get('exp'),ref:s3Get('ref'),fegreso:val('s4_fegreso'),constEgreso:val('s4_const').trim(),s4Puesto:val('s4_puesto').trim(),aspectos:val('s4_aspectos').trim(),acad:s3Get('acad'),cap:s3Get('cap'),reco:s3Get('reco'),reqLic:val('s3_reqLic').trim(),reqCert:val('s3_reqCert').trim(),conocOtros:val('s3_conocOtros').trim(),conocTec:val('s3_conocTec').trim(),conoc:Object.fromEntries(S3_KEYS.map(k=>[k,val('kn_'+k)])),
  adj:PADJ,modificado:Date.now(),modificadoPor:ME.nombre});
 await DB.put('personal',r);await syncPerUser(r);await log('Guardó legajo de personal',r.tdoc+' '+r.doc);go('#/per/list')}
async function perDel(id){if(ME.rol!=='admin')return;const r=S.personal.find(x=>x.id===id);if(!confirm('¿Eliminar definitivamente el legajo de '+r.nombres+' '+r.apePat+'?'))return;
 await log('Eliminó legajo de personal',r.tdoc+' '+r.doc);await DB.del('personal',id);go('#/per/list')}
function perPrint(id){const p=S.personal.find(x=>x.id===id);if(!p)return;
 const kv=(t,defs)=>`<h2><u>${t}</u></h2><table class="f">${defs.filter(x=>x[0]!=='_sp').reduce((a,x,i)=>{(i%3===0?a.push([x]):a[a.length-1].push(x));return a},[]).map(r=>'<tr>'+r.map(([k,l,ty])=>`<td><b>${l}:</b> ${esc(ty==='date'?fd(p[k]):p[k])||'&nbsp;'}</td>`).join('')+'</tr>').join('')}</table>`;
 popup(`<h2 style="text-align:center;font-size:18px">LEGAJO DEL PERSONAL — FICHA DE DATOS PERSONALES</h2>${kv('DATOS PERSONALES',LP_ID)}${kv('SITUACIÓN MÉDICA',LP_MED)}${kv('PERSONA CON DISCAPACIDAD',LP_DIS)}<p><b>Tipo:</b> ${esc((p.disTipos||[]).join(', '))}${p.disOtra?' · '+esc(p.disOtra):''}</p>
 <h2><u>BONIFICACIONES EN CONCURSOS</u></h2>${(p.bonif||[]).map(b=>`<p>${esc(b.t)} — ${esc(b.d)}</p>`).join('')||'<p>—</p>'}
 ${kv('VESTIMENTA / TALLAS',LP_TALLA)}${kv('NACIMIENTO',LP_NAC)}<p><b>EDAD:</b> ${edadDe(p.fnac)}</p>${kv('DIRECCIÓN ACTUAL',LP_DIR)}${kv('CONTACTO',LP_CON)}${kv('CONTACTO EN CASO DE EMERGENCIAS',LP_EME)}${kv('SISTEMA DE PENSIONES',[...LP_PEN,...LP_PENS])}${kv('DEPÓSITO DE REMUNERACIONES / HABERES',LP_BCO_R)}${kv('DEPÓSITO DE CTS',LP_BCO_C)}
 <h2><u>DATOS DE DERECHOHABIENTES / FAMILIARES DIRECTOS</u></h2><table class="f" style="font-size:11px;border:1px solid #999"><tr>${['VÍNCULO',...LP_FAMC.map(c=>c[1])].map(h=>`<td style="border:1px solid #999"><b>${h}</b></td>`).join('')}</tr>${famRead(p.fam).replace(/<td>/g,'<td style="border:1px solid #999">')}</table>
 <p style="font-size:10px">* Hijos mayores de 18 años con estudios ininterrumpidos hasta los 24: presentar documentos sustentatorios (asignación familiar). * Hijos mayores incapacitados: declarar para fines de EsSalud. * Adjuntar acta de matrimonio / escritura pública o resolución judicial de unión de hecho.</p>
${(()=>{const row=(cols,r)=>`<tr>${cols.map(c=>`<td style="border:1px solid #999">${esc(r[c[0]])||'&nbsp;'}</td>`).join('')}<td style="border:1px solid #999">${fd(r.fi)}</td><td style="border:1px solid #999">${fd(r.ff)}</td><td style="border:1px solid #999">${fmtYMD(ymd(r.fi,r.ff))}</td></tr>`;const head=cols=>`<tr>${[...cols.map(c=>c[1]),'F. INICIO','F. FIN','TIEMPO (aa/mm/dd)'].map(h=>`<td style="border:1px solid #999"><b>${h}</b></td>`).join('')}</tr>`;
 return `<h2><u>S2. INCORPORACIÓN / VINCULACIÓN CON LA ENTIDAD</u></h2><p><b>Puestos / cargos desempeñados</b></p><table class="f" style="font-size:11px;border:1px solid #999">${head(VINC_C)}${(p.vinc||[]).map(r=>row(VINC_C,r)).join('')||'<tr><td colspan="7">—</td></tr>'}<tr><td colspan="6" style="text-align:right"><b>TOTAL</b></td><td><b>${fmtYMD(sumYMD((p.vinc||[]).map(r=>ymd(r.fi,r.ff))))}</b></td></tr></table><p><b>Afiliaciones sindicales</b></p><table class="f" style="font-size:11px;border:1px solid #999">${head(SIND_C)}${(p.sind||[]).map(r=>row(SIND_C,r)).join('')||'<tr><td colspan="7">—</td></tr>'}</table>`})()}
 ${s3Print(p)}${s4Print(p)}${s5Print(p)}${s6Print(p)}${s7Print(p)}${s9Print(p)}${s11Print(p)}
 <h2><u>SITUACIÓN PERSONAL COMPLEMENTARIA</u></h2><p>${esc(p.situacion)||'—'}</p>
 <br><br><table style="width:100%"><tr><td style="text-align:center">____________________<br>Firma del trabajador</td><td style="text-align:center">____________________<br>Responsable</td></tr></table>`);log('Imprimió legajo de personal',p.doc)}

boot();
</script>
